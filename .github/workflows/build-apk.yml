name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SC_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > sc-fast-view.keystore
          # prove the decoded keystore is valid and holds our alias
          keytool -list -keystore sc-fast-view.keystore -storepass "${{ secrets.SC_KEYSTORE_PASSWORD }}" -storetype PKCS12 -alias "${{ secrets.SC_KEY_ALIAS }}"

      - name: Sync Capacitor Android
        # NOTE (v1.5.2): the DWG engine MUST stay bundled in the APK.
        # v1.4.1 removed it to make the APK small, but then the app had to
        # download the 8 MB engine on first DWG open — on a slow connection
        # that download fails and DWG files stop opening. Reliability wins.
        run: npx cap sync android

      - name: Build debug APK
        run: >
          cd android && ./gradlew assembleDebug
          -PKEYSTORE_PATH="${{ github.workspace }}/sc-fast-view.keystore"
          -PKEYSTORE_PASSWORD="${{ secrets.SC_KEYSTORE_PASSWORD }}"
          -PKEY_ALIAS="${{ secrets.SC_KEY_ALIAS }}"
          -PKEY_PASSWORD="${{ secrets.SC_KEY_PASSWORD }}"

      - name: Verify APK signature (fail if the wrong key was used)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signer: $FP"
          echo "$FP" | grep -qi "a0f5789126ba15877cd8e96ad67df72a1d1856efe47a998c74fae0ae08b87088" \
            || { echo "SIGNATURE MISMATCH — APK was not signed with the fixed SC key!"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sc-fast-view-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (for in-app updates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(jq -r .code www/version.json)
          VER=$(jq -r .version www/version.json)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" SC-Fast-View.apk
          # Ship the DWG engine as its own asset too (keeps the download
          # fallback in dwg.js working if the cache ever misses).
          cp www/libredwg/libredwg-web.wasm libredwg-web.wasm
          gh release create "v$CODE" --title "SC Fast View v$VER" --notes "تحديث تلقائي — حمّل SC-Fast-View.apk وثبّته من موبايلك." SC-Fast-View.apk libredwg-web.wasm \
            || gh release upload "v$CODE" SC-Fast-View.apk libredwg-web.wasm --clobber
