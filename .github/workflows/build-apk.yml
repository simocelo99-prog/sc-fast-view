name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: |
          # Small APK: keep the DWG engine OUT of the APK (it is ~8 MB).
          # The app loads it from its own storage (cached by v1.4.0) or
          # downloads it once from the release. Save a copy first for the
          # release asset below.
          cp www/libredwg/libredwg-web.wasm libredwg-web.wasm
          rm www/libredwg/libredwg-web.wasm
          npx cap sync android
          rm -f android/app/src/main/assets/public/libredwg/libredwg-web.wasm

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sc-fast-view-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (for in-app updates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(jq -r .code www/version.json)
          VER=$(jq -r .version www/version.json)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" SC-Fast-View.apk
          # The engine was saved before the sync step (it is not in www/
          # anymore, so the APK stays small). It ships as its own asset.
          gh release create "v$CODE" --title "SC Fast View v$VER" --notes "تحديث تلقائي — حمّل SC-Fast-View.apk وثبّته من موبايلك." SC-Fast-View.apk libredwg-web.wasm \
            || gh release upload "v$CODE" SC-Fast-View.apk libredwg-web.wasm --clobber
